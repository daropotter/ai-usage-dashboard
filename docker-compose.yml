# Local/dev compose project. Deliberately a DIFFERENT name than the production
# stack (`name: ai-usage-dashboard` in prod-stack/ai-usage-dashboard), so that
# `docker compose up/down` from this directory does not touch the production
# container `ai-usage-dashboard-prod`.
name: ai-usage-dashboard-dev

services:
  dashboard:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped
